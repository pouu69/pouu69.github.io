<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="pouu69의 개인 소개 사이트입니다." />
    <title>pouu69</title>
    <link rel="canonical" href="https://pouu69.github.io/" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 2rem;
        background: #ffffff;
        color: #17233b;
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
      }

      main {
        width: 100%;
        max-width: 40rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(3rem, 10vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      p {
        margin: 0 0 2.5rem;
        color: #667085;
        font-size: 1.125rem;
        line-height: 1.8;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.75rem 1.5rem;
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        color: #2457db;
        font-weight: 600;
        line-height: 1.5;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 3px solid #2457db;
        outline-offset: 4px;
        background: #edf3ff;
      }

      @media (max-width: 30rem) {
        body {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>pouu69</h1>
      <p>개인 소개를 준비하고 있습니다.</p>
      <a href="https://github.com/pouu69">GitHub</a>
    </main>
  </body>
</html>
